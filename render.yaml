services:
  - type: web
    name: commerce-stream-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENGINE_MODE
        value: demo
    disk:
      name: state
      mountPath: /app/logs
      sizeGB: 1
